<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>¡Llamada confirmada! — Método Paz</title>
<meta name="description" content="Tu llamada con Noelia Paz está confirmada. Mirá el video de preparación antes de la reunión.">
<meta name="robots" content="noindex, nofollow">

<link rel="icon" href="logo.png" type="image/png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-deep: #050505;
    --bg-main: #0A0A0A;
    --bg-section: #080808;
    --bg-card: #121212;
    --bg-card-hover: #1A1A1A;
    --accent: #C18F12;
    --accent-light: #D4A82A;
    --accent-dark: #9A720E;
    --accent-glow: rgba(193, 143, 18, 0.08);
    --accent-glow-strong: rgba(193, 143, 18, 0.15);
    --text-primary: #F5F5F0;
    --text-muted: #8A8A80;
    --text-light: #B5B5A8;
    --heading-font: 'Cormorant Garamond', serif;
    --body-font: 'Jost', sans-serif;
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; overflow-x: hidden; -webkit-text-size-adjust: 100%; }

  body {
    font-family: var(--body-font);
    background: var(--bg-deep);
    background-image: linear-gradient(
      180deg,
      rgba(193,143,18,0.06) 0%,
      rgba(193,143,18,0.02) 8%,
      transparent 16%,
      rgba(193,143,18,0.025) 28%,
      transparent 38%,
      rgba(193,143,18,0.02) 48%,
      transparent 56%,
      rgba(193,143,18,0.025) 66%,
      transparent 100%
    );
    color: var(--text-primary);
    overflow-x: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
    animation: pageIn 0.8s var(--ease-out-expo);
    line-height: 1.7;
  }

  @keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 200px;
    pointer-events: none;
    z-index: 0;
    opacity: 0.25;
  }

  .bg-glow-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: none; z-index: 0; }
  .bg-glow { position: absolute; border-radius: 50%; pointer-events: none; z-index: 0; }
  .bg-glow-1 {
    width: 120%; height: 1400px; top: -200px; left: -10%;
    background: radial-gradient(ellipse at 50% 30%, rgba(193,143,18,0.10) 0%, rgba(193,143,18,0.025) 40%, transparent 70%);
    filter: blur(120px);
  }
  .bg-glow-2 {
    width: 120%; height: 1600px; top: 1000px; right: -10%;
    background: radial-gradient(ellipse at 60% 40%, rgba(193,143,18,0.06) 0%, rgba(193,143,18,0.018) 40%, transparent 70%);
    filter: blur(140px);
  }

  .page-content { position: relative; z-index: 1; }

  .container { max-width: 860px; margin: 0 auto; padding: 0 24px; }

  img { max-width: 100%; height: auto; display: block; }
  a { color: inherit; text-decoration: none; }

  /* ── HEADER ── */
  .topbar {
    background: var(--accent);
    color: var(--bg-deep);
    text-align: center;
    padding: 14px 20px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .brand {
    text-align: center;
    padding: 28px 20px 0;
    font-family: var(--heading-font);
    font-size: 22px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: 0.02em;
  }
  .brand em { color: var(--accent); font-style: italic; }

  /* ── HERO ── */
  .hero {
    text-align: center;
    padding: 48px 24px 32px;
  }
  .check-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: rgba(193,143,18,0.12);
    border: 2px solid var(--accent);
    margin-bottom: 24px;
    animation: popIn 0.6s var(--ease-out-expo) 0.2s backwards;
  }
  .check-badge svg { width: 40px; height: 40px; stroke: var(--accent); }
  @keyframes popIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }

  .hero-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
  }
  .hero-title {
    font-family: var(--heading-font);
    font-size: clamp(34px, 5.5vw, 56px);
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.12;
    margin-bottom: 20px;
    letter-spacing: -0.01em;
  }
  .hero-title em { color: var(--accent); font-style: italic; }
  .hero-sub {
    font-size: 17px;
    font-weight: 300;
    color: var(--text-muted);
    line-height: 1.7;
    max-width: 620px;
    margin: 0 auto;
  }
  .hero-sub strong { color: var(--text-primary); font-weight: 500; }

  /* ── SECTION ── */
  section { padding: 56px 24px; position: relative; }
  .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 14px;
    text-align: center;
  }
  .section-title {
    font-family: var(--heading-font);
    font-size: clamp(28px, 4vw, 44px);
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.15;
    margin-bottom: 20px;
    text-align: center;
  }
  .section-title em { color: var(--accent); font-style: italic; }
  .section-body {
    font-size: 17px;
    font-weight: 300;
    color: var(--text-muted);
    line-height: 1.8;
    text-align: center;
    max-width: 680px;
    margin: 0 auto;
  }

  /* ── VIDEO ── */
  .video-wrap {
    margin: 40px auto 0;
    max-width: 820px;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid rgba(193,143,18,0.25);
    box-shadow: 0 24px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(193,143,18,0.08);
    background: #000;
    position: relative;
  }
  .video-wrap::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 22px;
    background: radial-gradient(ellipse at 50% 50%, rgba(193,143,18,0.4) 0%, transparent 70%);
    filter: blur(30px);
    z-index: -1;
    opacity: 0.6;
  }
  .video-wrap video,
  .video-wrap iframe {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16/9;
    background: #000;
    border: 0;
    object-fit: cover;
  }
  .video-wrap.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 16/9;
    color: var(--text-muted);
    font-size: 14px;
    font-style: italic;
    letter-spacing: 0.04em;
    text-align: center;
    padding: 40px;
  }
  .video-badge {
    display: inline-block;
    margin-top: 20px;
    padding: 8px 18px;
    background: rgba(193,143,18,0.12);
    border: 1px solid rgba(193,143,18,0.3);
    border-radius: 50px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .video-caption {
    text-align: center;
    margin-top: 16px;
    font-size: 14px;
    color: var(--text-muted);
    font-style: italic;
  }

  /* ── VSL PLAYER (video vertical, autoplay muted + click-to-unmute) ── */
  #vsl-player {
    width: 100%;
    max-width: 380px;
    margin: 40px auto 0;
    position: relative;
    aspect-ratio: 9 / 16;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid rgba(193,143,18,0.25);
    box-shadow: 0 24px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(193,143,18,0.08);
    background-color: #000;
  }
  #vsl-player::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 22px;
    background: radial-gradient(ellipse at 50% 50%, rgba(193,143,18,0.4) 0%, transparent 70%);
    filter: blur(30px);
    z-index: -1;
    opacity: 0.6;
  }
  #vsl-player video {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    border: 0;
    z-index: 1;
    background: #000;
  }
  #vsl-player .vsl-unmute {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: linear-gradient(180deg, rgba(0,0,0,0.20) 0%, rgba(0,0,0,0.55) 100%);
    border: 0;
    cursor: pointer;
    color: #fff;
    font-family: var(--body-font);
    z-index: 3;
    transition: background 0.3s ease, opacity 0.4s ease;
  }
  #vsl-player .vsl-unmute:hover { background: linear-gradient(180deg, rgba(0,0,0,0.10) 0%, rgba(0,0,0,0.45) 100%); }
  #vsl-player .vsl-unmute-icon {
    width: 88px;
    height: 88px;
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #050505;
    box-shadow: 0 8px 40px rgba(193,143,18,0.5), 0 0 0 10px rgba(193,143,18,0.18);
    animation: vslPulse 2s ease-in-out infinite;
  }
  #vsl-player .vsl-unmute-icon svg { width: 40px; height: 40px; }
  #vsl-player .vsl-unmute:hover .vsl-unmute-icon { transform: scale(1.06); transition: transform 0.3s ease; }
  #vsl-player .vsl-unmute-label {
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 8px 18px;
    background: rgba(0,0,0,0.55);
    border-radius: 30px;
    backdrop-filter: blur(4px);
    text-align: center;
  }
  @keyframes vslPulse {
    0%, 100% { box-shadow: 0 8px 40px rgba(193,143,18,0.5), 0 0 0 0 rgba(193,143,18,0.35); }
    50% { box-shadow: 0 8px 40px rgba(193,143,18,0.5), 0 0 0 18px rgba(193,143,18,0); }
  }
  #vsl-player.unmuted .vsl-unmute { opacity: 0; pointer-events: none; }
  @media (max-width: 600px) {
    #vsl-player { max-width: 320px; }
    #vsl-player .vsl-unmute-icon { width: 76px; height: 76px; }
    #vsl-player .vsl-unmute-icon svg { width: 32px; height: 32px; }
    #vsl-player .vsl-unmute-label { font-size: 0.7rem; letter-spacing: 1.5px; padding: 6px 14px; }
  }

  /* ── STEPS ── */
  .steps {
    display: grid;
    gap: 20px;
    margin-top: 44px;
    max-width: 720px;
    margin-left: auto;
    margin-right: auto;
  }
  .step {
    display: flex;
    gap: 20px;
    padding: 24px 26px;
    background: var(--bg-card);
    border: 1px solid rgba(193,143,18,0.15);
    border-radius: 16px;
    transition: all 0.35s var(--ease-out-expo);
  }
  .step:hover {
    border-color: rgba(193,143,18,0.35);
    transform: translateY(-2px);
    background: var(--bg-card-hover);
  }
  .step-num {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--bg-deep);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--heading-font);
    font-size: 22px;
    font-weight: 700;
  }
  .step-content h3 {
    font-family: var(--heading-font);
    font-size: 22px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 6px;
    line-height: 1.3;
  }
  .step-content p {
    font-size: 15px;
    color: var(--text-muted);
    line-height: 1.65;
  }
  .step-content strong { color: var(--text-primary); font-weight: 500; }

  /* ── ALIGNMENT BOX ── */
  .align-box {
    margin: 0 auto;
    max-width: 720px;
    padding: 40px 36px;
    background: linear-gradient(180deg, rgba(193,143,18,0.08) 0%, rgba(193,143,18,0.02) 100%);
    border: 1px solid rgba(193,143,18,0.25);
    border-radius: 20px;
    text-align: center;
  }
  .align-box .icon {
    font-size: 28px;
    margin-bottom: 16px;
    display: block;
  }
  .align-box h3 {
    font-family: var(--heading-font);
    font-size: 28px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 16px;
    line-height: 1.25;
  }
  .align-box h3 em { color: var(--accent); font-style: italic; }
  .align-box p {
    font-size: 16px;
    color: var(--text-muted);
    line-height: 1.75;
    margin-bottom: 14px;
  }
  .align-box p strong { color: var(--text-primary); font-weight: 500; }

  /* ── TESTIMONIALS (video cards) ── */
  .testimonials {
    display: grid;
    gap: 24px;
    margin-top: 44px;
    grid-template-columns: 1fr;
    max-width: 820px;
    margin-left: auto;
    margin-right: auto;
  }
  @media (min-width: 720px) {
    .testimonials { grid-template-columns: 1fr 1fr; }
  }
  .testimonial-card {
    background: var(--bg-card);
    border: 1px solid rgba(193,143,18,0.15);
    border-radius: 18px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: all 0.4s var(--ease-out-expo);
    position: relative;
  }
  .testimonial-card:hover {
    border-color: var(--accent);
    transform: translateY(-4px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.45);
  }
  .testimonial-card video {
    width: 100%;
    aspect-ratio: 9/16;
    object-fit: cover;
    display: block;
    background: #000;
  }
  .testimonial-card .info {
    padding: 22px 24px 24px;
  }
  .testimonial-card .name {
    font-family: var(--heading-font);
    font-size: 24px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 6px;
    line-height: 1.2;
  }
  .testimonial-card .quote {
    font-size: 15px;
    color: var(--text-muted);
    line-height: 1.55;
    font-style: italic;
    margin-bottom: 14px;
  }
  .testimonial-card .role {
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 600;
    padding-top: 12px;
    border-top: 1px solid rgba(193,143,18,0.15);
  }

  /* ── BTN ── */
  .btn-primary {
    background: var(--accent);
    color: var(--bg-deep);
    padding: 16px 36px;
    font-family: var(--body-font);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    transition: all 0.3s;
  }
  .btn-primary:hover {
    background: var(--accent-light);
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(193,143,18,0.3);
  }
  .btn-whatsapp {
    background: #25D366;
    color: #fff;
  }
  .btn-whatsapp:hover { background: #1fba57; box-shadow: 0 12px 32px rgba(37,211,102,0.3); }

  /* ── SIGNOFF ── */
  .signoff {
    text-align: center;
    padding: 24px;
    font-family: var(--heading-font);
    font-size: 22px;
    color: var(--text-primary);
    font-style: italic;
  }
  .signoff span { color: var(--accent); }

  /* ── FOOTER ── */
  footer {
    padding: 40px 24px 48px;
    text-align: center;
    border-top: 1px solid rgba(193,143,18,0.15);
    margin-top: 40px;
  }
  footer .footer-logo {
    font-family: var(--heading-font);
    font-size: 20px;
    color: var(--accent);
    margin-bottom: 8px;
  }
  footer p {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }

  @media (max-width: 640px) {
    section { padding: 44px 20px; }
    .hero { padding: 36px 20px 24px; }
    .hero-title { font-size: 34px; }
    .step { padding: 20px; gap: 16px; }
    .step-num { width: 38px; height: 38px; font-size: 18px; }
    .step-content h3 { font-size: 19px; }
    .align-box { padding: 32px 24px; }
    .align-box h3 { font-size: 24px; }
  }
</style>
</head>
<body>

<div class="bg-glow-wrapper">
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
</div>

<div class="page-content">

  <!-- TOPBAR -->
  <div class="topbar">✓ Tu llamada está confirmada</div>
  <div class="brand">Método <em>Paz</em></div>

  <!-- HERO: APERTURA (Gratitud) -->
  <section class="hero">
    <h1 class="hero-title">¡Gracias por agendar tu llamada!</h1>
  </section>

  <!-- VIDEO DE PREPARACIÓN — mensaje de Noelia (autoplay muted + click-to-unmute) -->
  <section>
    <div class="section-label">Un mensaje para vos</div>
    <h2 class="section-title">Mirá este video</h2>
    <p class="section-body">
      En 2 minutos Noe Paz te cuenta cómo va a ser la llamada y cómo prepararte.
    </p>

    <div id="vsl-player">
      <video id="vsl-video"
             autoplay muted loop playsinline preload="metadata"
             poster="vsl/llamada-admision-poster.jpg"
             aria-label="Noelia Paz — Preparate para tu llamada">
        <source src="vsl/llamada-admision.mp4" type="video/mp4">
        Tu navegador no soporta video HTML5.
      </video>
      <button type="button" class="vsl-unmute" id="vslUnmute" aria-label="Activar sonido del video desde el inicio">
        <span class="vsl-unmute-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>
        </span>
        <span class="vsl-unmute-label">Mirá este video con sonido</span>
      </button>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <div class="footer-logo">Método Paz</div>
    <p>Alimentación Antiinflamatoria a Base de Plantas · Noelia Paz</p>
  </footer>

</div>

<script>
  // Scroll reveal ligero
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.style.opacity = '1';
          entry.target.style.transform = 'translateY(0)';
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });
    document.querySelectorAll('section').forEach(function(el) {
      el.style.opacity = '0';
      el.style.transform = 'translateY(24px)';
      el.style.transition = 'opacity 0.7s cubic-bezier(0.16,1,0.3,1), transform 0.7s cubic-bezier(0.16,1,0.3,1)';
      io.observe(el);
    });
  }

  // Leer datos del invitee que Calendly pasa por query params (opcional)
  (function() {
    var params = new URLSearchParams(window.location.search);
    var name = params.get('invitee_full_name') || params.get('name');
    if (name) {
      var title = document.querySelector('.hero-title');
      if (title) {
        title.innerHTML = '¡Gracias por agendar tu llamada, <em>' + name.split(' ')[0] + '</em>!';
      }
    }
  })();

  // VSL: autoplay muted + loop + playsinline; el botón reinicia desde 0 con sonido.
  (function() {
    var vslPlayer = document.getElementById('vsl-player');
    var vslVideo = document.getElementById('vsl-video');
    var vslUnmute = document.getElementById('vslUnmute');
    if (!vslPlayer || !vslVideo || !vslUnmute) return;
    var attemptPlay = function() {
      try {
        var p = vslVideo.play();
        if (p && typeof p.catch === 'function') p.catch(function(){});
      } catch (e) {}
    };
    vslVideo.addEventListener('loadedmetadata', attemptPlay);
    vslVideo.addEventListener('canplay', attemptPlay);
    attemptPlay();

    vslUnmute.addEventListener('click', function() {
      try {
        vslVideo.currentTime = 0;
        vslVideo.muted = false;
        vslVideo.loop = false;
        vslVideo.controls = true;
        attemptPlay();
      } catch (e) {}
      vslPlayer.classList.add('unmuted');
    });
  })();
</script>
